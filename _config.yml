title: diary
subtitle: 张雨的生活记录
description: 照片、文字，以及平常的日子。
keywords:
  - 生活记录
  - 摄影
  - 日记
author: 张雨
language: zh-CN
timezone: Asia/Shanghai

url: https://cuiyu120.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :year-:month-:day-:title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 1
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

index_generator:
  path: ''
  per_page: 6
  order_by: -date

default_category: 生活
category_map:
tag_map:

date_format: YYYY-MM-DD
time_format: HH:mm
updated_option: mtime

per_page: 8
pagination_dir: page

theme: butterfly

search:
  path: search.xml
  field: post
  content: true
  format: html

deploy:
  type: ''
